[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qhcyber"
version = "0.1.0"
description = "Notebook-led research for quantum-hybrid cybersecurity classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=2.3,<3",
    "qiskit-aer",
    "qiskit-machine-learning>=0.9,<1",
    "pennylane",
    "torch",
]
deployment = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "joblib",
    "skops",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
