# One command to run Deployment 1 (QHybrid Lab):  docker compose up --build lab
# Then open http://127.0.0.1:8765. Run the tests inside the image:  docker compose run --rm test
services:
  lab:
    build:
      context: .
      dockerfile: deployment/lab/Dockerfile
      target: runtime
    image: qhybrid-lab:0.1.0
    # Loopback only: the service is reachable from this machine (or a tunnel on it), not the LAN.
    ports:
      - "127.0.0.1:8765:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: deployment/lab/Dockerfile
      target: test
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
